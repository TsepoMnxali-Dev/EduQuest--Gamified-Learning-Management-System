<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest | Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="app">

    <!-- Same navigation structure as the landing page -->
    <aside class="sidebar">
        <div>
            <div class="brand">
                <img src="images/eduquest-logo.png"
                     alt="EduQuest logo"
                     class="brand-logo">
                
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Classes</a>
                <a href="#" class="nav-link">Quizzes</a>
                <a href="#" class="nav-link">Resources</a>
                <a href="#" class="nav-link">Leaderboard</a>
                <a href="#" class="nav-link">Profile</a>
                <a href="#" class="nav-link">Help & Support</a>
            </nav>
        </div>

        <div class="sidebar-social">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </div>
    </aside>

    <!-- Login -->
    <main class="main auth-main">
        <div class="auth-wrapper">

            <section class="auth-card">

                <img src="images/eduquest-logo.png"
                     alt="EduQuest logo"
                     class="auth-logo">

                <h1>Welcome Back!</h1>

                <p class="auth-subtitle">
                    Sign in to continue your EduQuest journey.
                </p>

                <div class="error-message" id="error"></div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>

                        <a href="reset-password.html" class="forgot">
                            Forgot password?
                        </a>
                    </div>

                    <button type="submit"
                            class="btn btn-primary auth-submit">
                        Sign In
                    </button>

                </form>

                <div class="divider">or</div>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="signupp.html">Sign Up</a>
                </p>

            </section>

        </div>
    </main>

</div>


    <script src="js/api.js"></script>
    <script src="js/login.js" defer></script>
</body>
</html>
