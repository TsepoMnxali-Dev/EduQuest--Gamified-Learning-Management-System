<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest | Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme-unified.css">
    <!-- Reuse exactly the same local mathematics engine as the admin quiz editor. -->
    <link rel="stylesheet" href="../../js/vendor/katex/katex.min.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <img src="images/eduquest-logo.png" alt="EduQuest logo" class="brand-logo">
                </div>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">Home</a>
                    <a href="classes.html" class="nav-link">Classes</a>
                    <a href="Quizzes.html" class="nav-link active" aria-current="page">Quizzes</a>
                    <a href="resources.html" class="nav-link">Resources</a>
                    <a href="leaderboard.html" class="nav-link">Leaderboard</a>
                    <a href="profile.html" class="nav-link">Profile</a>
                    <a href="help.html" class="nav-link">Help &amp; Support</a>
                </nav>
            </div>
        </aside>
        <main class="main">
            <div class="quizzes-topbar">
                <div class="dashboard-welcome">
                    <h1 id="quiz-title">Quiz</h1>
                    <p id="quiz-subject"></p>
                </div>
                <div class="quiz-timer" id="quiz-timer" hidden>Time 00:00</div>
            </div>
            <div id="quiz-root" class="quiz-root" aria-live="polite"></div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="../../js/vendor/katex/katex.min.js"></script>
    <script src="../../js/math-format.js"></script>
    <script src="js/quiz.js" defer></script>
</body>
</html>
