
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduQuest | Leaderboard</title>

    <!-- Existing EduQuest stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- ======================================
             LEARNER SIDEBAR
             ====================================== -->

        <aside class="sidebar">

            <div>

                <div class="brand">
                    <img src="images/eduquest-logo.png"
                         alt="EduQuest Logo"
                         class="brand-logo">
                </div>

                <nav class="sidebar-nav">

                    <a href="dashboard.html"
                       class="nav-link">
                        Home
                    </a>

                    <a href="classes.html"
                       class="nav-link">
                        Classes
                    </a>

                    <a href="Quizzes.html"
                       class="nav-link">
                        Quizzes
                    </a>

                    <a href="resources.html"
                       class="nav-link">
                        Resources
                    </a>

                    <a href="leaderboard.html"
                       class="nav-link active">
                        Leaderboard
                    </a>

                    <a href="profile.html"
                       class="nav-link">
                        Profile
                    </a>

                    <a href="#"
                       class="nav-link">
                        Help &amp; Support
                    </a>

                </nav>

            </div>

            <div class="sidebar-social">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
            </div>

        </aside>

        <!-- ======================================
             MAIN LEADERBOARD CONTENT
             ====================================== -->

        <main class="main">

            <!-- Page heading -->

            <div class="leaderboard-topbar">

                <div class="page-head">

                    <h1>Leaderboard</h1>

                    <p>
                        See how you rank against your peers!
                    </p>

                </div>

                <div class="profile-mini">

                    <div class="profile-avatar">
                        L
                    </div>

                    <span>Learner</span>

                </div>

            </div>

            <!-- ======================================
                 LEADERBOARD PERIOD FILTERS

                 CHANGED:
                 Period values match backend endpoint.

                 week  = Last 7 days
                 month = Last 30 days
                 all   = All time
                 ====================================== -->

            <div class="leaderboard-tabs">

                <button type="button"
                        class="leaderboard-tab"
                        data-period="week">

                    This Week

                </button>

                <button type="button"
                        class="leaderboard-tab"
                        data-period="month">

                    This Month

                </button>

                <button type="button"
                        class="leaderboard-tab active"
                        data-period="all">

                    All Time

                </button>

            </div>

            <!-- ======================================
                 NEW: STATUS MESSAGE

                 Shows loading and API errors.
                 ====================================== -->

            <p id="leaderboardStatus"
               role="status"
               aria-live="polite">

                Loading leaderboard...

            </p>

            <!-- ======================================
                 NEW: EMPTY LEADERBOARD

                 Displayed when nobody has earned
                 points from submitted quizzes.

                 No dummy learners will appear.
                 ====================================== -->

            <section id="emptyLeaderboard"
                     class="dashboard-section"
                     style="display:none;
                            text-align:center;
                            padding:35px;">

                <h2>
                    No leaderboard rankings yet
                </h2>

                <p>
                    Rankings will appear once learners
                    start earning points from quizzes.
                </p>

            </section>

            <!-- ======================================
                 DYNAMIC TOP THREE PODIUM

                 CHANGED:
                 Removed hardcoded learner names,
                 scores and positions.

                 JavaScript creates the podium
                 using actual backend rankings.
                 ====================================== -->

            <div id="leaderboardPodium"
                 class="podium"
                 style="display:none;">
            </div>

            <!-- ======================================
                 FULL LEADERBOARD RANKINGS

                 CHANGED:
                 No static learner records.

                 The backend determines ranking.
                 ====================================== -->

            <section id="leaderboardRankingsSection"
                     class="dashboard-section"
                     style="display:none;">

                <h2 class="leaderboard-list-title">
                    Full Rankings
                </h2>

                <div id="leaderboardList"
                     class="dashboard-list">
                </div>

            </section>

        </main>

    </div>

    <!-- ======================================
         JAVASCRIPT FILES

         IMPORTANT:
         Load the API helper first.
         ====================================== -->

    <script src="js/api.js"></script>

    <script src="js/leaderboard.js" defer></script>

</body>
</html>
