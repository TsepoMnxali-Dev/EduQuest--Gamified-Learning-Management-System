<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest | Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <div>
            <div class="brand">
                <img src="images/eduquest-logo.png" alt="EduQuest logo" class="brand-logo">
                
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Classes</a>
                <a href="#" class="nav-link">Quizzes</a>
                <a href="#" class="nav-link">Resources</a>
                <a href="#" class="nav-link">Leaderboard</a>
                <a href="#" class="nav-link">Profile</a>
                <a href="#" class="nav-link">Help & Support</a>
            </nav>
        </div>

        <div class="sidebar-social">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </div>
    </aside>

    <main class="main auth-main">
        <div class="auth-wrapper">
            <section class="auth-card">

                <img src="images/eduquest-logo.png" alt="EduQuest logo" class="auth-logo">

                <h1>Reset Password</h1>

                <p class="auth-subtitle">
                    Enter your email and we'll help you reset your password.
                </p>

                <div class="reset-help">
                    Use the email address connected to your EduQuest learner account.
                </div>

                <form id="resetForm">

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit">
                        Send Reset Link
                    </button>

                </form>

                <a href="login.html" class="back-link">
                    ← Back to Sign In
                </a>

            </section>
        </div>
    </main>

</div>

    <script src="js/reset-password.js" defer></script>
</body>
</html>
