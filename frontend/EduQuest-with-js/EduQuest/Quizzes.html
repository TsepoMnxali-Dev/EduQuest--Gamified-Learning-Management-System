<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest | Quizzes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <img src="images/eduquest-logo.png" alt="EduQuest logo" class="brand-logo">
                </div>

                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">Home</a>
                    <a href="classes.html" class="nav-link">Classes</a>
                    <a href="Quizzes.html" class="nav-link active">Quizzes</a>
                    <a href="resources.html" class="nav-link">Resources</a>
                    <a href="leaderboard.html" class="nav-link">Leaderboard</a>
                    <a href="profile.html" class="nav-link">Profile</a>
                    <a href="#" class="nav-link">Help & Support</a>
                </nav>
            </div>

            <div class="sidebar-social">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
            </div>
        </aside>

        <main class="main">
            <div class="quizzes-topbar">
                <div class="dashboard-welcome">
                    <h1>Quizzes</h1>
                    <p>Work through each subject's quizzes at your own pace.</p>
                </div>
                <div class="profile-mini">
                    <div class="profile-avatar" id="quizAvatar">&nbsp;</div>
                    <span id="quizLearnerName">Learner</span>
                </div>
            </div>

            <div class="quiz-summary">
                <div class="profile-stat">
                    <div class="stat-number" id="sumDone">-</div>
                    <div class="stat-text">Completed</div>
                </div>
                <div class="profile-stat">
                    <div class="stat-number" id="sumTodo">-</div>
                    <div class="stat-text">Still To Do</div>
                </div>
                <div class="profile-stat">
                    <div class="stat-number" id="sumAvg">-</div>
                    <div class="stat-text">Average Score</div>
                </div>
            </div>

            <p id="quizzesMessage" class="quizzes-message" style="display:none; margin:0 0 16px;"></p>

            <div class="quizzes-grid" id="quizzesGrid">
                <p>Loading your quizzes...</p>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/quizzes.js" defer></script>
</body>
</html>
