<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest | Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="app">

    <!-- Left navigation -->
    <aside class="sidebar">
        <div>
            <div class="brand">
                <img src="images/eduquest-logo.png"
                     alt="EduQuest logo"
                     class="brand-logo">
              
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Classes</a>
                <a href="#" class="nav-link">Quizzes</a>
                <a href="#" class="nav-link">Resources</a>
                <a href="#" class="nav-link">Leaderboard</a>
                <a href="#" class="nav-link">Profile</a>
                <a href="#" class="nav-link">Help & Support</a>
            </nav>
        </div>

        <div class="sidebar-social">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </div>
    </aside>

    <!-- Main landing page -->
    <main class="main landing-main">
        <div class="landing-inner">

            <section class="hero">
                <img src="images/eduquest-logo.png"
                     alt="EduQuest logo"
                     class="hero-logo">

                <p class="tagline">Enhancing Education Through Tech</p>

                <h1>Welcome!</h1>

                <div class="hero-actions">
                    <a href="login.html" class="btn btn-primary">Sign In</a>
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                </div>
            </section>

            <section class="stats-panel">
                <div class="stats-grid">

                    <div class="stat">
                        <div class="stat-number">5000+</div>
                        <div class="stat-text">students enrolled</div>
                    </div>

                    <div class="stat">
                        <div class="stat-number">1000+</div>
                        <div class="stat-text">Schools</div>
                    </div>

                    <div class="stat">
                        <div class="stat-number">80%</div>
                        <div class="stat-text">
                            of the enrolled students have improved
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </main>

</div>
    <script src="js/index.js" defer></script>
</body>
</html>
