<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Leaderboard | EduQuest</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <!-- Topbar -->
    <header class="topbar">

        <div class="topbar-search">
            <input 
                type="search" 
                placeholder="Search EduQuest..."
            >
        </div>

        <div class="topbar-actions">

            <button class="notification-btn">
                🔔
            </button>

            <button class="profile-btn">
                👤 Admin
            </button>

        </div>

    </header>
    <!-- Dashboard layout -->
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div>

                <div class="brand">

                    <img 
                        src="../../images/EduQuestLogo.jpg"
                        alt="EduQuest Logo"
                        class="brand-logo"
                    >

                    <div class="brand-name">
                        EduQuest
                    </div>

                </div>


                <!-- Navigation -->
                <nav class="sidebar-nav">

                    <a href="dashboard.html" class="nav-link">
                        Home
                    </a>

                    <a href="users.html" class="nav-link">
                        Users
                    </a>

                    <a href="quiz.html" class="nav-link">
                        Quizzes
                    </a>

                    <a href="resources.html" class="nav-link">
                        Resources
                    </a>

                    <a href="competition.html" class="nav-link">
                        Competitions
                    </a>

                    <a href="leaderboard.html" class="nav-link active">
                        Leaderboard
                    </a>

                    <a href="reports.html" class="nav-link">
                        Reports
                    </a>

                </nav>

            </div>
             <!-- Sidebar footer -->
            <div class="sidebar-footer">

                <p>
                    Enhancing education through tech.
                </p>

                <small>
                    © 2026 EduQuest
                </small>

            </div>

        </aside>
        <!-- Main content -->
        <main class="main">

            <section class="home-content">

                <div class="page-header">
                    <h1>
                        Learner Leaderboard
                    </h1>

                    <p>
                        National and Regional Rankings
                    </p>

                </div>
                <section class="leaderboard-page">

    
    <div class="leaderboard-filters">

        <div class="subject-tabs">
            <button class="subject-tab active" data-subject="Overall">
                Overall
            </button>

            <button class="subject-tab" data-subject="Mathematics">
                Mathematics
            </button>

            <button class="subject-tab" data-subject="Physical Sciences">
                Physical Sciences
            </button>

            <button class="subject-tab" data-subject="Accounting">
                Accounting
            </button>
        </div>

        <select id="regionFilter" class="region-filter">
            <option value="All regions">All regions</option>
            <option value="Nelson Mandela Bay">Nelson Mandela Bay</option>
            <option value="Buffalo City">Buffalo City</option>
            <option value="Sarah Baartman">Sarah Baartman</option>
            <option value="Chris Hani">Chris Hani</option>
            <option value="Joe Gqabi">Joe Gqabi</option>
        </select>

    </div>


    
    <div class="section-heading">
        <h2>Top learners <span id="rankingTitle">national</span></h2>

        <p id="rankingDescription">
            Overall ranking, all regions
        </p>
    </div>


    <div class="top-learners" id="topLearners">

       

    </div>


    
    <div class="section-heading regional-heading">

        <h2>Top learner by region</h2>

        <p>Highest scorer in each of the five regions</p>

    </div>


    <div class="regional-leaders" id="regionalLeaders">

        

    </div>

</section>
<script src="../../js/leaderboard.js"></script>
