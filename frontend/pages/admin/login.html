
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduQuest | Admin Sign In</title>

    <link rel="stylesheet" href="../../css/style.css">

    <!-- NEW: Admin login-specific styling -->
    <style>
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .admin-login-card h1 {
            margin-bottom: 8px;
            color: #172554;
        }

        .admin-login-card p {
            color: #64748b;
            margin-bottom: 24px;
        }

        .admin-login-card label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .admin-login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .admin-field {
            margin-bottom: 18px;
        }

        .admin-password-wrapper {
            position: relative;
        }

        .admin-password-wrapper input {
            padding-right: 65px;
        }

        .admin-show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #2563eb;
        }

        .admin-login-button {
            width: 100%;
            padding: 13px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .admin-message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 6px;
            font-size: 14px;
        }

        .admin-message.error {
            display: block;
            background: #fff1f2;
            color: #b42318;
        }

        .admin-message.success {
            display: block;
            background: #ecfdf3;
            color: #027a48;
        }

        .admin-login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- NEW: Admin login interface -->
    <main class="admin-login-page">

        <section class="admin-login-card">

            <h1>EduQuest Admin</h1>

            <p>
                Sign in to access the administration portal.
            </p>

            <!-- NEW: Login notifications -->
            <div id="adminLoginMessage"
                 class="admin-message"
                 role="status"
                 aria-live="polite">
            </div>

            <form id="adminLoginForm" novalidate>

                <div class="admin-field">

                    <label for="adminEmail">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>

                </div>

                <div class="admin-field">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="admin-password-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <!-- NEW: Password visibility -->
                        <button
                            type="button"
                            id="adminTogglePassword"
                            class="admin-show-password">
                            Show
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    id="adminLoginButton"
                    class="admin-login-button">

                    Sign In as Admin

                </button>

            </form>

            <div class="admin-login-footer">
                <a href="../../EduQuest-with-js/EduQuest/login.html">
                    Learner Sign In
                </a>
            </div>

        </section>

    </main>

    <!-- Shared admin API helper -->
    <script src="../../js/api.js"></script>

    <!-- NEW: Admin login functionality -->
    <script src="../../js/admin-login.js"></script>

</body>
</html>
